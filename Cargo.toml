[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.100"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
# complex_script_segmentation: 日本語の単語分割の辞書（ICU4X の cjdict）を入れる。無いと文字の配置のたびに
# "No segmentation model for complex script: Chinese/Japanese" の警告が出る
bevy = { version = "0.20", features = ["complex_script_segmentation"] }
# ピッキング・シーン・メッシュ由来コライダー・デバッグ描画は使わない（ヘッドレスのテストで不要なResourceを要求するため）
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "xpbd_joints", "parallel"] }
glam = "0.33"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
rstest = "0.28"
proptest = "1.12"
mockall = "0.15"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
crc32fast = "1.5"
dirs = "7"
tempfile = "3"
serde_json = "1"
bevy-intl = { git = "https://github.com/DelsarteAdam/bevy-intl", branch = "master", features = ["bundle-only"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# 開発中
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# 配布用
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"