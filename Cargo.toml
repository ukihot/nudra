[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.94"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
bevy = "0.20"
avian3d = "0.8"
glam = "0.33"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
rstest = "0.28"
proptest = "1.12"
mockall = "0.15"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
crc32fast = "1.5"
dirs = "7"
tempfile = "3"
serde_json = "1"
bevy-intl = { git = "https://github.com/DelsarteAdam/bevy-intl", branch = "master", features = ["bundle-only"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 3
